name: Release Windows Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build distributable with spec
        run: |
          pyinstaller --noconfirm --clean chesschampion.spec

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ChessChampion/* -DestinationPath dist/ChessChampion-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessChampion-windows
          path: dist/ChessChampion-windows.zip

      - name: Attach artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ChessChampion-windows.zip
